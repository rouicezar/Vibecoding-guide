<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vibe Coding UI 组件精准描述词典</title>
  <style>
    :root {
      --card-h: 500px;
      --demo-h: 184px;
      --radius: 4px;
      --font: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    html[data-theme="dark"] {
      --bg: #000000;
      --bg-2: #0a0a0a;
      --card: #0e0e0e;
      --demo: #161616;
      --line: #262626;
      --line-2: #3f3f3f;
      --text: #fafafa;
      --muted: #a3a3a3;
      --faint: #737373;
      --fill: #171717;
      --fill-2: #1f1f1f;
      --accent: #f97316;
      --accent-ink: #fff7ed;
      --ok: #22c55e;
      --warn: #fbbf24;
      --info: #60a5fa;
      --teal: #2dd4bf;
      --danger: #ef4444;
      --shadow: none;
      --overlay: rgba(0,0,0,.62);
    }
    html[data-theme="light"] {
      --bg: #ffffff;
      --bg-2: #fafafa;
      --card: #ffffff;
      --demo: #f3f3f3;
      --line: #e5e5e5;
      --line-2: #d4d4d4;
      --text: #0a0a0a;
      --muted: #525252;
      --faint: #a3a3a3;
      --fill: #f5f5f5;
      --fill-2: #eeeeee;
      --accent: #ea580c;
      --accent-ink: #fff7ed;
      --ok: #16a34a;
      --warn: #d97706;
      --info: #2563eb;
      --teal: #0d9488;
      --danger: #dc2626;
      --shadow: none;
      --overlay: rgba(10,10,10,.32);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      background: var(--bg); color: var(--text);
      font: 14px/1.5 var(--font);
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    svg { flex: 0 0 auto; }
    .wrap { max-width: 1520px; margin: 0 auto; padding: 0 16px 40px; }
    .mast {
      position: sticky; top: 0; z-index: 8;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      margin: 0 -16px 14px; padding: 12px 16px 10px;
    }
    .top {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 12px; margin-bottom: 10px;
    }
    .hero h1 { margin: 0 0 4px; font-size: 20px; font-weight: 650; letter-spacing: -0.03em; }
    .hero p { margin: 0; color: var(--muted); max-width: none; font-size: 12px; line-height: 1.45; }
    .formula {
      margin-top: 8px; padding: 0 0 0 10px; border-left: 2px solid var(--accent);
      color: var(--faint); font-size: 12px; line-height: 1.5;
    }
    .formula em { font-style: normal; color: var(--text); }
    .filters {
      display: flex; flex-direction: column; gap: 8px;
      padding: 8px; border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--card);
    }
    .theme-switch {
      display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius);
      overflow: hidden; flex: 0 0 auto;
    }
    .theme-switch button {
      display: inline-flex; align-items: center; gap: 6px;
      height: 32px; padding: 0 10px; border: 0; background: transparent; color: var(--muted);
    }
    .theme-switch button + button { border-left: 1px solid var(--line); }
    .theme-switch button.on { color: var(--accent); background: var(--fill); }
    .toolbar { display: flex; gap: 8px; margin: 0; align-items: center; }
    .search {
      flex: 1; height: 34px; padding: 0 10px; border-radius: var(--radius);
      border: 1px solid var(--line); background: var(--bg); outline: none;
    }
    .search:focus { border-color: var(--info); }
    .count { color: var(--faint); font-size: 12px; white-space: nowrap; }
    .cats { display: flex; flex-wrap: wrap; gap: 5px; margin: 0; }
    .cat {
      border: 1px solid var(--line); background: transparent; color: var(--muted);
      border-radius: var(--radius); padding: 4px 9px; font-size: 12px;
    }
    .cat:hover { color: var(--text); }
    .cat.active { color: var(--accent); background: transparent; border-color: var(--accent); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 10px;
    }
    .card {
      height: var(--card-h);
      display: flex; flex-direction: column;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden; min-width: 0;
    }
    .card:hover { border-color: var(--line-2); }
    .demo {
      height: var(--demo-h); flex: 0 0 var(--demo-h);
      background: var(--demo); border-bottom: 1px solid var(--line);
      position: relative; overflow: hidden; padding: 10px;
    }
    .meta { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 8px 10px 10px; }
    .row { display: grid; grid-template-columns: 52px 1fr; gap: 6px; margin-bottom: 3px; align-items: start; }
    .meta .row:nth-child(1) { margin-bottom: 0; }
    .meta .row:nth-child(2) {
      margin-bottom: 7px; padding-bottom: 7px; border-bottom: 1px solid var(--line);
    }
    .k { color: var(--faint); font-size: 10px; padding-top: 3px; letter-spacing: 0.02em; }
    .v { min-width: 0; }
    .zh { font-weight: 650; font-size: 15px; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .en { color: var(--info); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .aliases, .when {
      color: var(--muted); font-size: 12px; line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
    }
    .prompt-box {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--line);
    }
    .prompt-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .copy {
      height: 22px; padding: 0 8px; border-radius: 4px; border: 1px solid var(--line);
      background: transparent; color: var(--muted); font-size: 11px;
    }
    .copy:hover { color: var(--accent); border-color: var(--accent); }
    .copy.ok { color: var(--ok); border-color: var(--ok); }
    .prompt-scroll {
      flex: 1; min-height: 0; overflow: auto; padding: 7px 8px;
      background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
    }
    .prompt {
      margin: 0; padding: 0; border: 0; background: transparent;
      color: var(--muted); font: 11px/1.5 var(--mono);
      white-space: pre-wrap; word-break: break-word;
    }
    .prompt-zh {
      margin: 8px 0 0; padding-top: 6px; border-top: 1px dashed var(--line);
      color: var(--faint); font: 10px/1.45 var(--font);
    }
    .empty-filter { color: var(--muted); padding: 48px 0; text-align: center; grid-column: 1 / -1; }

    .ui-btn {
      border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 11px;
      background: transparent; color: var(--text); font-weight: 500;
    }
    .ui-btn:hover { border-color: var(--text); }
    .ui-btn.secondary { background: transparent; color: var(--text); border-color: var(--line); }
    .ui-btn.outline { background: transparent; color: var(--text); border-color: var(--line); }
    .ui-btn.ghost { background: transparent; color: var(--text); border-color: transparent; }
    .ui-btn.text { background: transparent; color: var(--text); border: 0; padding-inline: 4px; text-decoration: underline; text-underline-offset: 3px; }
    .ui-btn.link { background: transparent; color: var(--info); border: 0; text-decoration: underline; text-underline-offset: 3px; }
    .ui-btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
    .ui-btn.icon, .ui-btn.circle {
      width: 32px; height: 32px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .ui-btn.circle { border-radius: 50%; }
    .ui-btn[disabled] { opacity: .4; cursor: not-allowed; }
    .ui-btn.on { background: transparent; color: var(--accent); border-color: var(--accent); }
    .fab {
      position: absolute; right: 12px; bottom: 12px; width: 40px; height: 40px;
      border-radius: 50%; border: 1px solid var(--accent); background: transparent; color: var(--accent);
      display: flex; align-items: center; justify-content: center;
    }
    .field, .select-face {
      width: 100%; height: 32px; padding: 0 9px; border-radius: var(--radius);
      border: 1px solid var(--line); background: var(--card);
    }
    .field:focus, .select-face:focus { outline: none; border-color: var(--info); }
    textarea.field { height: 72px; padding: 8px 9px; resize: none; }
    .tabs { display: flex; gap: 0; position: relative; }
    .tab {
      background: none; border: 0; color: var(--muted); padding: 7px 10px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .tab.active { color: var(--accent); }
    .tab-underline { border-bottom: 1px solid var(--line); }
    .tab-underline .ink {
      position: absolute; left: 0; bottom: -1px; height: 1px; background: var(--accent);
      transition: transform .16s ease, width .16s ease;
    }
    .pills .tab { border: 1px solid transparent; border-radius: 999px; }
    .pills .tab.active { border-color: var(--accent); color: var(--accent); background: transparent; }
    .seg { display: flex; background: transparent; border: 1px solid var(--line); border-radius: var(--radius); padding: 2px; }
    .seg .tab { flex: 1; justify-content: center; border-radius: 2px; }
    .seg .tab.active { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .menu, .popover {
      position: absolute; background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); min-width: 148px; z-index: 3;
    }
    .menu button, .list-item {
      display: block; width: 100%; text-align: left; background: none; border: 0;
      color: var(--text); padding: 7px 11px;
    }
    .menu button:hover, .list-item:hover { background: var(--fill); }
    .list-item.on { color: var(--info); }
    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      border: 1px solid var(--info); color: var(--info); border-radius: 999px; padding: 1px 8px; font-size: 12px;
      background: var(--card);
    }
    .chip .x { cursor: pointer; display: inline-flex; }
    .track { height: 4px; background: var(--fill-2); border-radius: 99px; position: relative; overflow: hidden; }
    .tree-row { display: flex; gap: 6px; align-items: center; padding: 3px 0; cursor: pointer; font-size: 12px; }
    .toast {
      position: absolute; right: 10px; bottom: 10px;
      background: var(--card); border: 1px solid var(--ok);
      color: var(--ok);
      padding: 7px 10px; border-radius: var(--radius); font-size: 12px;
    }
    .modal-mask {
      position: absolute; inset: 0; background: var(--overlay);
      display: flex; align-items: center; justify-content: center; z-index: 4;
    }
    .modal { width: 86%; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
    .drawer {
      position: absolute; top: 0; right: 0; bottom: 0; width: 58%;
      background: var(--card); border-left: 1px solid var(--line); z-index: 4; padding: 10px;
    }
    .sheet {
      position: absolute; left: 0; right: 0; bottom: 0;
      background: var(--card); border-top: 1px solid var(--line); z-index: 4; padding: 10px;
    }
    .mini-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .mini-table th, .mini-table td { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: left; }
    .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
    .spin {
      width: 18px; height: 18px; border: 1.5px solid var(--line-2);
      border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes shimmer { 0% { background-position: -160px 0; } 100% { background-position: 160px 0; } }
    .skel { height: 8px; border-radius: 2px; background: var(--fill-2); margin: 8px 0; }
    .shimmer {
      background: linear-gradient(90deg, var(--fill-2) 0, var(--line) 50%, var(--fill-2) 100%);
      background-size: 160px 100%; animation: shimmer 1.1s infinite;
    }
    .center { height: 100%; display: flex; align-items: center; justify-content: center; }
    .hscroll { overflow-x: auto; }
    .grow { flex: 1; min-height: 0; overflow: auto; }
    .hint { color: var(--faint); font-size: 11px; }
    .split { display: flex; height: 100%; }
    .pane { overflow: auto; padding: 6px; }
    .gutter { width: 5px; background: var(--info); cursor: col-resize; flex: 0 0 5px; }
    .kanban { display: flex; gap: 8px; height: 100%; }
    .kanban .col:nth-child(1) { border-top: 2px solid var(--accent); }
    .kanban .col:nth-child(2) { border-top: 2px solid var(--ok); }
    .kanban .col:nth-child(3) { border-top: 2px solid var(--info); }
    .col { flex: 1; background: var(--fill); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px; overflow: auto; }
    .card-mini { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; font-size: 12px; }
    .star-btn { background: none; border: 0; color: var(--faint); padding: 0 2px; display: inline-flex; }
    .star-btn.on { color: var(--accent); }
    .otp { display: flex; gap: 6px; justify-content: center; }
    .otp input {
      width: 30px; height: 36px; text-align: center; border-radius: var(--radius);
      border: 1px solid var(--line); background: var(--card);
    }
    .otp input:focus { outline: none; border-color: var(--accent); }
    .code {
      font-family: var(--mono); font-size: 11px; background: var(--fill);
      border: 1px solid var(--line); padding: 8px; border-radius: var(--radius);
      height: 100%; overflow: auto; white-space: pre;
    }
    .bubble { max-width: 80%; background: var(--fill); border: 1px solid var(--line); border-radius: 8px 8px 8px 2px; padding: 7px 10px; font-size: 12px; }
    .bubble.me { margin-left: auto; background: var(--card); border-color: var(--info); border-radius: 8px 8px 2px 8px; }
    .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; font-size: 11px; }
    .cal b, .cal button { text-align: center; padding: 4px 0; border: 0; background: none; color: var(--text); border-radius: 4px; }
    .cal button.sel { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .rail { display: flex; flex-direction: column; gap: 4px; width: 36px; }
    .rail button {
      height: 32px; border: 1px solid transparent; border-radius: var(--radius);
      background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center;
    }
    .rail button.on { color: var(--accent); border-color: var(--accent); background: var(--card); }
    .bnav { display: flex; width: 100%; }
    .bnav button {
      flex: 1; background: none; border: 0; color: var(--muted); font-size: 10px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .bnav button.on { color: var(--accent); }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    input[type=checkbox], input[type=radio] { accent-color: var(--ok); }
    .ico-row { display: inline-flex; align-items: center; gap: 6px; }

    .title-mark { color: var(--accent); }
    .kw { font-style: normal; }
    .kw-o { color: var(--accent); }
    .kw-g { color: var(--ok); }
    .kw-b { color: var(--info); }
    .count .n { color: var(--accent); }
    .ui-btn.solid { background: var(--accent); color: #fff; border-color: var(--accent); }
    .sw {
      width: 36px; height: 20px; border-radius: 99px; border: 1px solid var(--line);
      background: transparent; position: relative; padding: 0;
    }
    .sw i {
      position: absolute; width: 14px; height: 14px; border-radius: 50%;
      background: var(--muted); top: 2px; left: 2px; pointer-events: none;
    }
    .sw.on { border-color: var(--ok); }
    .sw.on i { left: 18px; background: var(--ok); }
    .dropzone {
      height: 100%; border: 1px dashed var(--line); display: flex; align-items: center;
      justify-content: center; color: var(--muted); font-size: 12px; text-align: center;
    }
    .dropzone.on { border-color: var(--info); color: var(--info); }
    .delta-up { color: var(--ok); font-size: 12px; }
    .delta-dn { color: var(--danger); font-size: 12px; }
    .prog { height: 4px; background: var(--fill-2); border-radius: 99px; overflow: hidden; width: 100%; }
    .prog > i { display: block; height: 100%; background: var(--ok); width: 42%; }
    .indet-bar { height: 3px; background: var(--fill-2); overflow: hidden; width: 100%; }
    .indet-bar i { display: block; width: 40%; height: 100%; background: var(--accent); animation: indet 1s ease-in-out infinite; }
    @keyframes indet { 0% { transform: translateX(-100%); } 100% { transform: translateX(280%); } }
    .circ-p {
      width: 44px; height: 44px; border-radius: 50%;
      background: conic-gradient(var(--info) 72%, var(--line) 0);
      display: grid; place-items: center;
    }
    .circ-p span { width: 30px; height: 30px; border-radius: 50%; background: var(--demo); color: var(--info); font-size: 10px; display: grid; place-items: center; }
    .status-ok { color: var(--ok); }
    .status-warn { color: var(--warn); }
    .status-err { color: var(--danger); }
    .status-info { color: var(--info); }
    .add-line { color: var(--ok); }
    .del-line { color: var(--danger); }
    .phone-frame { height: 100%; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .safe-top, .safe-bot { height: 10px; background: var(--fill); flex: 0 0 auto; }
    .gantt-bar { height: 10px; border-radius: 2px; opacity: .9; }
    .masonry { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; height: 100%; }
    .masonry .t { background: var(--fill); border: 1px solid var(--line); }
    .masonry .t:nth-child(1) { border-color: var(--accent); }
    .masonry .t:nth-child(2) { border-color: var(--ok); }
    .masonry .t:nth-child(3) { border-color: var(--info); }
    .masonry .t:nth-child(4) { border-color: var(--accent); }
    .thumb { width: 28px; height: 28px; border: 1px solid var(--line); background: var(--fill); }
    .thumb.on { border-color: var(--accent); background: var(--accent); }
    .v-slider { writing-mode: vertical-lr; direction: rtl; height: 120px; width: 24px; }
    .dot.warn { background: var(--warn); }
    .dot.err { background: var(--danger); }
    .dot.info { background: var(--info); }
    .star-btn.on { color: var(--accent); }
    .ed { height: 72px; border: 1px solid var(--line); padding: 6px; overflow: auto; font-size: 12px; outline: none; }
    .crumb { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
    .crumb button { background: none; border: 0; color: var(--muted); padding: 0; }
    .crumb button.on { color: var(--info); }
    .page-n { display: flex; gap: 4px; }
    .page-n button { min-width: 24px; height: 24px; border: 1px solid var(--line); background: transparent; color: var(--text); }
    .page-n button.on { border-color: var(--info); color: var(--info); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mast">
      <div class="top">
        <header class="hero">
          <h1>Vibe Coding UI 组件<span class="title-mark">词典</span></h1>
          <p>把脑子里的样子写成标准名称，再交给模型。卡片一样大，上面的组件可以点。</p>
          <div class="formula">以后按这个说：<em><span class="kw kw-o">名称</span> + <span class="kw kw-g">变体</span> + <span class="kw kw-b">结构</span> + 交互 + 状态 + 动效</em>。细线跟着 Tab 走，请写 underlined tabs，不要写 slider。</div>
        </header>
        <div class="theme-switch" role="group" aria-label="颜色模式">
          <button type="button" id="themeDark" data-mode="dark">深色</button>
          <button type="button" id="themeLight" data-mode="light">浅色</button>
        </div>
      </div>
      <div class="filters">
        <div class="toolbar">
          <input class="search" id="q" placeholder="搜中文名、英文名或别名" />
          <span class="count" id="count"></span>
        </div>
        <div class="cats" id="cats"></div>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <script>
(function () {
  const CATS = [
    ["all", "全部"], ["tabs", "Tabs"], ["stepper", "Stepper"], ["button", "Button"],
    ["input", "Input"], ["select", "Select"], ["selection", "Selection"], ["slider", "Slider"],
    ["datetime", "日期时间"], ["special", "特殊输入"], ["upload", "上传"], ["menu", "Menu"],
    ["nav", "Navigation"], ["card", "Card"], ["data", "数据展示"], ["tag", "Tag / Badge"],
    ["accordion", "Accordion"], ["overlay", "Overlay"], ["feedback", "反馈"], ["loading", "Loading"],
    ["empty", "Empty"], ["layout", "布局"], ["saas", "SaaS / AI"], ["tree", "Tree"],
    ["mobile", "移动端"], ["desktop", "桌面"]
  ];
  const ICONS = {

  const $ = function (t, a, kids) {

      else if (k === "style" && typeof v === "object") Object.assign(n.style, v);

      else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
    });
    (Array.isArray(kids) ? kids : [kids]).forEach(function (c) {

    return n;
  };

  function demoTabs(host, opts) {
    var kind = opts.kind, items = ["首页", "项目", "设置"], icons = ["home", "grid", "settings"], i = 0;
    if (kind === "scroll" || kind === "closable" || kind === "drag") items = ["概览", "文档", "API", "账单", "成员"];
    if (kind === "switcher") items = ["全部", "已读", "未读"];
    if (kind === "vertical") items = ["账户", "权限", "账单"];
    function paint() {
      clear(host);
      if (kind === "vertical") {
        var col = $("div", { style: { display: "flex", height: "100%", gap: "8px" } });
        var tabs = $("div", { style: { display: "flex", flexDirection: "column", width: "76px" } });
        items.forEach(function (lab, idx) {
          tabs.append($("button", { class: "tab" + (idx === i ? " active" : ""), onclick: function () { i = idx; paint(); } }, lab));
        });
        col.append(tabs, $("div", { class: "grow card-mini" }, "内容区 · " + items[i]));
        host.append(col); return;
      }
      var bar = $("div", { class: "tabs" + (kind === "pill" ? " pills" : (kind === "segmented" || kind === "switcher" ? " seg" : "")) + (kind === "scroll" ? " hscroll" : "") });
      if (kind === "sliding" || kind === "underline") bar.classList.add("tab-underline");
      items.forEach(function (lab, idx) {
        var content = lab;
        if (kind === "icon") content = icon(icons[idx] || "grid", 16);
        if (kind === "iconLabel") content = rowI(icons[idx] || "grid", lab);
        if (kind === "closable") {
          var wrap = $("span", { class: "ico-row" }, lab);
          wrap.append($("span", { onclick: function (e) { e.stopPropagation(); items.splice(idx, 1); i = Math.min(i, items.length - 1); paint(); } }, icon("x", 12)));
          content = wrap;
        }
        var b = $("button", { class: "tab" + (idx === i ? " active" : ""), draggable: kind === "drag" ? "true" : "false", onclick: function () { i = idx; paint(); } }, content);
        if (kind === "drag") {
          b.addEventListener("dragstart", function (e) { e.dataTransfer.setData("text", String(idx)); });
          b.ondragover = function (e) { e.preventDefault(); };
          b.ondrop = function (e) { e.preventDefault(); var from = +e.dataTransfer.getData("text"); var t = items.splice(from, 1)[0]; items.splice(idx, 0, t); i = idx; paint(); };
        }
        bar.append(b);
      });
      host.append(bar);
      if (kind === "contained" || kind === "folder") host.append($("div", { class: "card-mini", style: { marginTop: "8px" } }, items[i] + " 面板"));

      if (kind === "sliding" || kind === "underline") {

  }

          });
          if (k === "cards") frame.append($("div", { class: "ico-row", style: { justifyContent: "center" } }, [
            $("button", { class: "ui-btn secondary", onclick: function () { toastIn(host, "跳过"); page = (page + 1) % 3; paint(); } }, "跳过"),
            $("button", { class: "ui-btn solid", onclick: function () { toastIn(host, "喜欢"); page = (page + 1) % 3; paint(); } }, "喜欢")
          ]));
          frame.append(dots); host.append(frame); return;
        }
        if (k === "pull") {
          frame.append($("button", { class: "list-item", onclick: function () { toastIn(host, "已刷新"); } }, "下拉刷新（点击模拟）"));
          frame.append($("div", { class: "hint" }, "条目一"), $("div", { class: "hint" }, "条目二"));
          host.append(frame); return;
        }
        if (k === "swipe") {
          var row = $("div", { style: { display: "flex", height: "40px" } });
          row.append($("div", { class: "grow card-mini", onclick: function () { revealed = !revealed; paint(); } }, "左滑删除"));
          if (revealed) row.append($("button", { class: "ui-btn danger", onclick: function () { toastIn(host, "已删除"); revealed = false; paint(); } }, "删除"));
          frame.append(row); host.append(frame); return;
        }
        var hold;
        frame.append($("div", { class: "card-mini", onmousedown: function () { hold = setTimeout(function () { toastIn(host, "长按菜单"); }, 480); }, onmouseup: function () { clearTimeout(hold); }, onmouseleave: function () { clearTimeout(hold); } }, "按住约 0.5 秒"));
        host.append(frame);
      }
      paint(); return;
    }

    if (d === "desktop") {
      var tab = 0, edge = "right", pos = { x: 24, y: 28 };
      function paint() {
        clear(host);
        if (k === "three" || k === "activity" || k === "explorer") {
          var split = $("div", { class: "split", style: { height: "100%" } });
          var rail = $("div", { class: "rail" });
          ["grid", "search", "settings"].forEach(function (n, i) {
            var b = $("button", { class: i === tab ? "on" : "", onclick: function () { tab = i; paint(); } });
            b.append(icon(n, 14)); rail.append(b);
          });
          split.append(rail);
          if (k !== "activity") split.append($("div", { class: "pane", style: { width: "36%" } }, ["src", "App.tsx", "styles.css"][tab] || "src"));
          split.append($("div", { class: "pane grow" }, "编辑器"));
          if (k === "three") split.append($("div", { class: "pane", style: { width: "28%" } }, "检查器"));
          host.append(split); return;
        }
        if (k === "edtabs") {
          ["App.tsx", "main.ts"].forEach(function (n, i) {
            host.append($("button", { class: "tab" + (i === tab ? " active" : ""), onclick: function () { tab = i; paint(); } }, n));
          });
          host.append($("div", { class: "code grow" }, "// " + ["App.tsx", "main.ts"][tab])); return;
        }
        if (k === "edpane") { clear(host).append($("div", { class: "code", style: { height: "100%" } }, "function render() {}")); return; }
        if (k === "prop") { clear(host).append($("div", { class: "hint" }, "宽度"), $("input", { class: "field", value: "240" }), $("div", { class: "hint" }, "可见"), $("input", { type: "checkbox", checked: true })); return; }
        if (k === "status") { clear(host).append($("div", { class: "ico-row", style: { marginTop: "auto" } }, [$("span", { class: "status-ok" }, "main"), $("span", { class: "hint" }, "0 问题"), $("span", { class: "hint" }, "UTF-8")])); return; }
        if (k === "cmdbar") {
          [["file", "打开"], ["copy", "复制"], ["trash", "删除"]].forEach(function (p) {
            var b = $("button", { class: "ui-btn secondary", onclick: function () { toastIn(host, p[1]); } });
            b.append(rowI(p[0], p[1])); host.append(b);
          }); return;
        }
        if (k === "dock") {
          host.append($("div", { class: "hint" }, "停靠：" + edge));
          ["left", "right", "bottom"].forEach(function (e) {
            host.append($("button", { class: "ui-btn secondary" + (edge === e ? " on" : ""), onclick: function () { edge = e; paint(); } }, e));
          }); return;
        }
        var pan = $("div", { class: "card-mini", style: { position: "absolute", left: pos.x + "px", top: pos.y + "px", width: "120px", cursor: "grab" } }, "拖动手柄");
        pan.onmousedown = function (e) {
          var sx = e.clientX, sy = e.clientY, ox = pos.x, oy = pos.y;
          function mv(ev) { pos = { x: Math.max(0, ox + ev.clientX - sx), y: Math.max(0, oy + ev.clientY - sy) }; pan.style.left = pos.x + "px"; pan.style.top = pos.y + "px"; }
          function up() { document.removeEventListener("mousemove", mv); document.removeEventListener("mouseup", up); }
          document.addEventListener("mousemove", mv); document.addEventListener("mouseup", up);
        };
        clear(host).append(pan);
      }
      paint(); return;
    }

    clear(host).append(cen([$("div", { class: "hint" }, it.en)]));
  }

  var cat = "all", q = "";
  var grid = document.getElementById("grid");
  var catsEl = document.getElementById("cats");
  var countEl = document.getElementById("count");
  var root = document.documentElement;
  var themeDark = document.getElementById("themeDark");
  var themeLight = document.getElementById("themeLight");

  function applyTheme(mode) {
    root.setAttribute("data-theme", mode);
    localStorage.setItem("ui-dict-theme", mode);
    themeDark.className = mode === "dark" ? "on" : "";
    themeLight.className = mode === "light" ? "on" : "";
    clear(themeDark); themeDark.append(icon("moon", 14), document.createTextNode(" 深色"));
    clear(themeLight); themeLight.append(icon("sun", 14), document.createTextNode(" 浅色"));
  }
  applyTheme(localStorage.getItem("ui-dict-theme") || "dark");
  themeDark.onclick = function () { applyTheme("dark"); };
  themeLight.onclick = function () { applyTheme("light"); };

  function visible() {
    var s = q.trim().toLowerCase();
    return CATALOG.filter(function (it) {
      if (cat !== "all" && it.category !== cat) return false;
      if (!s) return true;
      return [it.zh, it.en, it.aliases, it.when, it.prompt, it.promptZh].join(" ").toLowerCase().indexOf(s) >= 0;
    });
  }

  function render() {
    var items = visible();
    countEl.innerHTML = "<span class=\"n\">" + items.length + "</span> / " + CATALOG.length;
    clear(grid);
    if (!items.length) { grid.append($("div", { class: "empty-filter" }, "没有匹配的组件")); return; }
    items.forEach(function (it) {
      var demo = $("div", { class: "demo" });
      var copy = $("button", { class: "copy" }, "复制");
      copy.onclick = function () {
        navigator.clipboard.writeText(it.prompt).catch(function () {});
        copy.textContent = "已复制"; copy.classList.add("ok");
        setTimeout(function () { copy.textContent = "复制"; copy.classList.remove("ok"); }, 1200);
      };
      grid.append($("article", { class: "card" }, [
        demo,
        $("div", { class: "meta" }, [
          $("div", { class: "row" }, [$("span", { class: "k" }, "中文俗称"), $("div", { class: "v zh", title: it.zh }, it.zh)]),
          $("div", { class: "row" }, [$("span", { class: "k" }, "标准英文"), $("div", { class: "v en", title: it.en }, it.en)]),
          $("div", { class: "row" }, [$("span", { class: "k" }, "常见别名"), $("div", { class: "v aliases", title: it.aliases }, it.aliases)]),
          $("div", { class: "row" }, [$("span", { class: "k" }, "何时使用"), $("div", { class: "v when", title: it.when }, it.when)]),
          $("div", { class: "prompt-box" }, [$("div", { class: "prompt-head" }, [$("span", { class: "k" }, "AI Prompt"), copy]), $("div", { class: "prompt-scroll" }, [$("pre", { class: "prompt" }, it.prompt), $("p", { class: "prompt-zh" }, it.promptZh)])])
        ])
      ]));
      mountDemo(demo, it);
    });
  }

  CATS.forEach(function (pair) {
    var b = $("button", { class: "cat" + (pair[0] === "all" ? " active" : "") }, pair[1]);
    b.onclick = function () { cat = pair[0]; [].forEach.call(catsEl.children, function (x) { x.classList.toggle("active", x === b); }); render(); };
    catsEl.append(b);
  });
  document.getElementById("q").addEventListener("input", function (e) { q = e.target.value; render(); });
  render();
})();

  </script>
</body>
</html>
