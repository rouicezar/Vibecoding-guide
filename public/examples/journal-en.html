<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My learning journal · Practice example</title>
<style>
body{font:17px/1.7 system-ui,sans-serif;background:#f5f7fb;color:#172238;margin:0}main{max-width:640px;margin:48px auto;padding:24px}h1{margin-bottom:8px}p{color:#526078}label{display:block;font-weight:600}textarea{box-sizing:border-box;width:100%;padding:14px;border:1px solid #aab5c6;border-radius:8px;font:inherit}button{font:inherit;background:#254edb;color:white;border:0;border-radius:8px;padding:10px 24px;cursor:pointer;margin-top:12px}li{background:white;border:1px solid #dce2ee;border-radius:8px;padding:16px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}ul{padding:0;list-style:none}small{display:block;color:#526078}#status{min-height:28px;color:#21478c}
</style>
<main>
<a href="/en/learn/goal/">← Return to the learning step</a><small>Vibe Guide · Working practice example</small>
<h1>My learning journal</h1>
<p>Write one thing learned today. Notes stay in this browser at this address. Clearing browser data removes them.</p>
<form id="form"><label for="note">What did I learn today?</label><textarea id="note" rows="4" maxlength="2000"></textarea><button>Save note</button></form>
<p id="status" role="status" aria-live="polite"></p>
<h2>Learning history</h2><p id="empty">No notes yet. Write the first one.</p><ul id="records"></ul>
</main>
<script>
const key='vibe-guide-journal-example-v1';
const note=document.getElementById('note'),status=document.getElementById('status'),list=document.getElementById('records');
let records=[],readable=true;
try{records=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(records)||records.some(r=>typeof r.text!=='string'||typeof r.time!=='string'))throw Error();}
catch{readable=false;status.textContent='Saved notes could not be read. Keep the existing data and ask AI for help.';}
function render(){list.replaceChildren();document.getElementById('empty').hidden=records.length>0;for(const r of records){const li=document.createElement('li'),time=document.createElement('small'),text=document.createElement('span');time.textContent=r.time;text.textContent=r.text;li.append(time,text);list.append(li);}}
document.getElementById('form').addEventListener('submit',event=>{event.preventDefault();const text=note.value.trim();if(!text){status.textContent='Write a note before saving.';note.focus();return;}if(!readable){status.textContent='Resolve the read failure first. The input is kept.';return;}const next=[{text,time:new Date().toLocaleString('en')},...records];try{localStorage.setItem(key,JSON.stringify(next));records=next;render();note.value='';status.textContent='已保存，可在Learning history中查看。';}catch{status.textContent='Saving failed. Input is kept; retain a copy and ask AI for help.';}});
if(readable)render();
</script>
</html>
