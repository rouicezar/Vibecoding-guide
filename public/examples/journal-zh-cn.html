<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的学习记录 · 练习示例</title>
<style>
body{font:17px/1.7 system-ui,sans-serif;background:#f5f7fb;color:#172238;margin:0}main{max-width:640px;margin:48px auto;padding:24px}h1{margin-bottom:8px}p{color:#526078}label{display:block;font-weight:600}textarea{box-sizing:border-box;width:100%;padding:14px;border:1px solid #aab5c6;border-radius:8px;font:inherit}button{font:inherit;background:#254edb;color:white;border:0;border-radius:8px;padding:10px 24px;cursor:pointer;margin-top:12px}li{background:white;border:1px solid #dce2ee;border-radius:8px;padding:16px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}ul{padding:0;list-style:none}small{display:block;color:#526078}#status{min-height:28px;color:#21478c}
</style>
<main>
<a href="/zh-cn/learn/goal/">← 返回学习步骤</a><small>Vibe Guide · 可操作的练习成品</small>
<h1>我的学习记录</h1>
<p>写下今天学到的一件事。记录只保存在当前浏览器、当前地址，清理浏览器数据会丢失。</p>
<form id="form"><label for="note">今天学了什么？</label><textarea id="note" rows="4" maxlength="2000"></textarea><button>保存记录</button></form>
<p id="status" role="status" aria-live="polite"></p>
<h2>学习历史</h2><p id="empty">还没有记录，先写下第一条。</p><ul id="records"></ul>
</main>
<script>
const key='vibe-guide-journal-example-v1';
const note=document.getElementById('note'),status=document.getElementById('status'),list=document.getElementById('records');
let records=[],readable=true;
try{records=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(records)||records.some(r=>typeof r.text!=='string'||typeof r.time!=='string'))throw Error();}
catch{readable=false;status.textContent='已有记录暂时无法读取。请先保留现场，向 AI 反馈，不覆盖原记录。';}
function render(){list.replaceChildren();document.getElementById('empty').hidden=records.length>0;for(const r of records){const li=document.createElement('li'),time=document.createElement('small'),text=document.createElement('span');time.textContent=r.time;text.textContent=r.text;li.append(time,text);list.append(li);}}
document.getElementById('form').addEventListener('submit',event=>{event.preventDefault();const text=note.value.trim();if(!text){status.textContent='请先写下学习内容，再保存。';note.focus();return;}if(!readable){status.textContent='请先处理读取失败，当前输入已保留。';return;}const next=[{text,time:new Date().toLocaleString('zh-CN')},...records];try{localStorage.setItem(key,JSON.stringify(next));records=next;render();note.value='';status.textContent='已保存，可在学习历史中查看。';}catch{status.textContent='保存失败，输入仍在。请保留内容并向 AI 反馈。';}});
if(readable)render();
</script>
</html>
